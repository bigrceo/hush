[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hush-agents"
version = "0.1.0"
description = "Python client for HUSH: private x402 payments for AI agents on Solana (Agent Shop, leash, receipts)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://hushagents.com"
Source = "https://github.com/bigrceo/hush"

[project.scripts]
hush = "hush_agents.cli:main"
